<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2545" />
    <meta
      name="description"
      content="Clearview Eye Clinic offers consultant-led private eye care on Harley Street, London. Book an appointment for examinations, imaging and treatment."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Clearview Eye Clinic | Specialist eye care in London</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f6f1e8;
      }
      .boot-bar {
        height: 40px;
        background: #0b2545;
      }
      .boot-head {
        height: 72px;
        background: #f6f1e8;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .boot-hero {
        height: calc(100svh - 112px);
        min-height: 24rem;
        background: #e7e2d8;
      }
      .boot-cards {
        display: grid;
        gap: 16px;
        max-width: 1120px;
        margin: 0 auto;
        padding: 64px 16px 32px;
      }
      .boot-card {
        min-height: 168px;
        padding: 24px;
        border-radius: 16px;
        background: #fff;
      }
      .bone {
        height: 14px;
        margin-top: 12px;
        border-radius: 8px;
        background: rgba(11, 37, 69, 0.1);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .bone.lg {
        width: 42%;
        height: 22px;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (min-width: 768px) {
        .boot-cards {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading the page">
        <div class="boot-bar"></div>
        <div class="boot-head"></div>
        <div class="boot-hero"></div>
        <div class="boot-cards">
          <div class="boot-card"><div class="bone lg"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div></div>
          <div class="boot-card"><div class="bone lg"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div></div>
          <div class="boot-card"><div class="bone lg"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
